<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Rich Nature Emerald to Soft Forest -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>

    <!-- Green Foliage Gradients -->
    <linearGradient id="leafGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    
    <linearGradient id="leafGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <linearGradient id="leafGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="60%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Trunk Wood Gradient -->
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="40%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#583101"/>
    </linearGradient>

    <!-- Golden Accents for Family Nodes -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="appShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14532d" flood-opacity="0.25"/>
    </filter>

    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#064e3b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Container -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="#86efac" stroke-width="4"/>

  <!-- Subtle Sunburst / Glow behind tree -->
  <circle cx="256" cy="200" r="175" fill="#fef9c3" opacity="0.45"/>
  <circle cx="256" cy="200" r="140" fill="#fef08a" opacity="0.35"/>

  <!-- Tree Group with Shadow -->
  <g filter="url(#appShadow)" transform="translate(0, -5)">

    <!-- Roots Base / Grass Mound -->
    <path d="M120 405 C 180 380, 332 380, 392 405 C 330 425, 180 425, 120 405 Z" fill="#16a34a" opacity="0.8"/>
    <ellipse cx="256" cy="405" rx="150" ry="16" fill="#15803d" opacity="0.6"/>

    <!-- Deep Spreading Roots -->
    <path d="M256 360 C 235 385, 180 400, 135 412" stroke="#78350f" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M256 360 C 277 385, 332 400, 377 412" stroke="#78350f" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M235 375 C 205 395, 175 410, 150 422" stroke="#854d0e" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M277 375 C 307 395, 337 410, 362 422" stroke="#854d0e" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Sturdy Wooden Trunk & Main Branches -->
    <path d="M256 185
             C 256 240, 240 290, 226 345
             C 214 380, 186 395, 170 405
             L 342 405
             C 326 395, 298 380, 286 345
             C 272 290, 256 240, 256 185 Z" fill="url(#trunkGrad)"/>

    <!-- Side Branch Left -->
    <path d="M246 290 Q 185 250, 140 230" stroke="url(#trunkGrad)" stroke-width="15" stroke-linecap="round" fill="none"/>
    <path d="M185 250 Q 155 200, 125 180" stroke="url(#trunkGrad)" stroke-width="9" stroke-linecap="round" fill="none"/>

    <!-- Side Branch Right -->
    <path d="M266 290 Q 327 250, 372 230" stroke="url(#trunkGrad)" stroke-width="15" stroke-linecap="round" fill="none"/>
    <path d="M327 250 Q 357 200, 387 180" stroke="url(#trunkGrad)" stroke-width="9" stroke-linecap="round" fill="none"/>

    <!-- Upper Branches -->
    <path d="M256 230 Q 200 170, 175 125" stroke="url(#trunkGrad)" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M256 230 Q 312 170, 337 125" stroke="url(#trunkGrad)" stroke-width="11" stroke-linecap="round" fill="none"/>

    <!-- Lush Green Canopy Foliage (Layered Clouds of Leaves) -->
    <!-- Back Canopy Layer (Dark Forest Green) -->
    <g filter="url(#leafShadow)">
      <circle cx="256" cy="120" r="75" fill="url(#leafGradDark)"/>
      <circle cx="170" cy="140" r="62" fill="url(#leafGradDark)"/>
      <circle cx="342" cy="140" r="62" fill="url(#leafGradDark)"/>
      <circle cx="115" cy="205" r="50" fill="url(#leafGradDark)"/>
      <circle cx="397" cy="205" r="50" fill="url(#leafGradDark)"/>
      <circle cx="160" cy="240" r="45" fill="url(#leafGradDark)"/>
      <circle cx="352" cy="240" r="45" fill="url(#leafGradDark)"/>
    </g>

    <!-- Middle Canopy Layer (Vibrant Leaf Green) -->
    <g>
      <circle cx="256" cy="130" r="66" fill="url(#leafGradMain)"/>
      <circle cx="185" cy="150" r="54" fill="url(#leafGradMain)"/>
      <circle cx="327" cy="150" r="54" fill="url(#leafGradMain)"/>
      <circle cx="130" cy="210" r="44" fill="url(#leafGradMain)"/>
      <circle cx="382" cy="210" r="44" fill="url(#leafGradMain)"/>
      <circle cx="215" cy="200" r="48" fill="url(#leafGradMain)"/>
      <circle cx="297" cy="200" r="48" fill="url(#leafGradMain)"/>
    </g>

    <!-- Top Highlight Canopy Layer (Fresh Mint & Emerald Green) -->
    <g opacity="0.95">
      <circle cx="256" cy="105" r="42" fill="url(#leafGradLight)"/>
      <circle cx="195" cy="130" r="36" fill="url(#leafGradLight)"/>
      <circle cx="317" cy="130" r="36" fill="url(#leafGradLight)"/>
      <circle cx="140" cy="190" r="30" fill="url(#leafGradLight)"/>
      <circle cx="372" cy="190" r="30" fill="url(#leafGradLight)"/>
      <circle cx="256" cy="165" r="35" fill="url(#leafGradLight)"/>
    </g>

    <!-- Decorative Leaves Details (Stylized Leaf Shapes) -->
    <path d="M256 62 C 246 75, 246 95, 256 100 C 266 95, 266 75, 256 62 Z" fill="#86efac"/>
    <path d="M190 85 C 180 96, 182 112, 192 116 C 200 110, 198 96, 190 85 Z" fill="#86efac"/>
    <path d="M322 85 C 332 96, 330 112, 320 116 C 312 110, 314 96, 322 85 Z" fill="#86efac"/>
    <path d="M105 165 C 96 175, 98 190, 108 193 C 115 188, 113 175, 105 165 Z" fill="#86efac"/>
    <path d="M407 165 C 416 175, 414 190, 404 193 C 397 188, 399 175, 407 165 Z" fill="#86efac"/>

    <!-- Family Heritage Nodes (Connecting Generations in Leaves) -->
    <!-- Ancestor Root Node (Top) -->
    <circle cx="256" cy="115" r="18" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="256" cy="115" r="10" fill="url(#goldGrad)"/>

    <!-- Generation Nodes Left -->
    <circle cx="180" cy="150" r="14" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="180" cy="150" r="7" fill="url(#goldGrad)"/>

    <circle cx="130" cy="210" r="12" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="130" cy="210" r="6" fill="url(#goldGrad)"/>

    <!-- Generation Nodes Right -->
    <circle cx="332" cy="150" r="14" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="332" cy="150" r="7" fill="url(#goldGrad)"/>

    <circle cx="382" cy="210" r="12" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="382" cy="210" r="6" fill="url(#goldGrad)"/>

    <!-- Glowing Node Connectors -->
    <line x1="256" y1="125" x2="180" y2="150" stroke="#fef08a" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.9"/>
    <line x1="256" y1="125" x2="332" y2="150" stroke="#fef08a" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.9"/>
    <line x1="180" y1="160" x2="130" y2="210" stroke="#fef08a" stroke-width="2" stroke-dasharray="3 3" opacity="0.9"/>
    <line x1="332" y1="160" x2="382" y2="210" stroke="#fef08a" stroke-width="2" stroke-dasharray="3 3" opacity="0.9"/>
  </g>

  <!-- Bottom Kurdish Label Banner: مینە سەر فیل -->
  <g transform="translate(256, 452)">
    <rect x="-180" y="-30" width="360" height="46" rx="23" fill="#ffffff" filter="url(#appShadow)"/>
    <rect x="-176" y="-26" width="352" height="38" rx="19" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="0" y="0" font-family="'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#15803d" text-anchor="middle" dominant-baseline="middle">
      نەوەکانی مینە سەر فیل
    </text>
  </g>
</svg>
