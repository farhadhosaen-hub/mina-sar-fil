<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خێزانی مینە سەر فیل</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Tajawal',sans-serif;background:#0d1117;color:#e6edf3;direction:rtl;}
:root{--green:#2ea043;--gold:#d29922;--dark:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;}

/* Header */
header{background:linear-gradient(135deg,#0a3d0a,#1a5c1a,#2ea043);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 20px rgba(46,160,67,.3);}
.header-title h1{font-size:1.8rem;font-weight:900;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5);}
.header-title p{font-size:.9rem;color:#a8d5a8;margin-top:2px;}
.auth-area{display:flex;align-items:center;gap:12px;}
.user-info{display:flex;align-items:center;gap:10px;}
.user-avatar{width:36px;height:36px;border-radius:50%;border:2px solid var(--gold);}
.user-name{font-size:.9rem;color:#fff;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.btn{padding:8px 18px;border:none;border-radius:8px;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:.9rem;font-weight:600;transition:.2s;}
.btn-login{background:var(--gold);color:#000;}
.btn-login:hover{background:#e6b020;}
.btn-logout{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);}
.btn-logout:hover{background:rgba(255,255,255,.25);}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:#3fb84e;}
.btn-danger{background:#da3633;color:#fff;}
.btn-danger:hover{background:#e74c3c;}
.btn-secondary{background:var(--border);color:var(--text);}
.btn-secondary:hover{background:#40464f;}

/* Search & Filters */
.controls{padding:20px 24px;background:#010409;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
.search-box{flex:1;min-width:220px;position:relative;}
.search-box input{width:100%;padding:10px 16px 10px 40px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:.95rem;outline:none;transition:.2s;}
.search-box input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(46,160,67,.15);}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1rem;}
.gen-filters{display:flex;flex-wrap:wrap;gap:8px;}
.gen-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'Tajawal',sans-serif;font-size:.85rem;transition:.2s;}
.gen-btn:hover,.gen-btn.active{background:var(--green);border-color:var(--green);color:#fff;}

/* Stats */
.stats{display:flex;gap:16px;padding:16px 24px;background:#010409;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 20px;display:flex;align-items:center;gap:12px;min-width:120px;}
.stat-icon{font-size:1.5rem;}
.stat-info{line-height:1.3;}
.stat-num{font-size:1.3rem;font-weight:700;color:var(--green);}
.stat-label{font-size:.78rem;color:var(--muted);}

/* Member Grid */
.members-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:24px;}
.member-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;transition:.25s;position:relative;overflow:hidden;}
.member-card::before{content:'';position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,var(--green),var(--gold));}
.member-card:hover{border-color:var(--green);transform:translateY(-3px);box-shadow:0 8px 30px rgba(46,160,67,.2);}
.card-top{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.member-photo{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--border);background:var(--border);display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0;overflow:hidden;}
.member-photo img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.member-info h3{font-size:1rem;font-weight:700;color:var(--text);line-height:1.3;}
.member-info .years{font-size:.82rem;color:var(--muted);margin-top:3px;}
.alive-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.72rem;font-weight:600;margin-top:4px;}
.alive{background:rgba(46,160,67,.2);color:#3fb84e;border:1px solid rgba(46,160,67,.3);}
.deceased{background:rgba(139,148,158,.1);color:var(--muted);border:1px solid var(--border);}
.card-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.card-city{font-size:.82rem;color:var(--muted);}
.gen-badge{padding:3px 10px;border-radius:12px;font-size:.75rem;font-weight:600;background:rgba(210,153,34,.15);color:var(--gold);border:1px solid rgba(210,153,34,.3);}

/* Modal Overlay */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);}
.modal-overlay.show{display:flex;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;position:relative;}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:2;}
.modal-header h2{font-size:1.2rem;font-weight:700;}
.modal-close{background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer;padding:4px 8px;border-radius:6px;}
.modal-close:hover{color:var(--text);background:var(--border);}
.modal-body{padding:24px;}

/* Detail Modal */
.detail-photo{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid var(--green);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:3rem;background:var(--dark);overflow:hidden;}
.detail-photo img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.detail-name{text-align:center;font-size:1.5rem;font-weight:800;margin-bottom:6px;}
.detail-years{text-align:center;color:var(--muted);font-size:.95rem;margin-bottom:20px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.info-item{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.info-label{font-size:.75rem;color:var(--muted);margin-bottom:4px;}
.info-value{font-size:.95rem;font-weight:500;}
.info-value a{color:var(--green);text-decoration:none;cursor:pointer;}
.info-value a:hover{text-decoration:underline;}
.notes-box{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:20px;}
.notes-box .info-label{margin-bottom:6px;}
.children-list{margin-bottom:20px;}
.children-list h4{font-size:.9rem;color:var(--muted);margin-bottom:10px;}
.child-chip{display:inline-block;padding:4px 12px;background:rgba(46,160,67,.1);border:1px solid rgba(46,160,67,.3);border-radius:20px;font-size:.85rem;color:var(--green);margin:3px;cursor:pointer;}
.child-chip:hover{background:rgba(46,160,67,.25);}
.detail-actions{display:flex;gap:10px;margin-bottom:24px;}

/* Comments */
.comments-section h4{font-size:1rem;font-weight:700;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.comment-item{display:flex;gap:12px;margin-bottom:16px;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.comment-avatar{width:36px;height:36px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:700;flex-shrink:0;overflow:hidden;}
.comment-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.comment-bubble{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:10px 14px;flex:1;}
.comment-meta{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
.comment-name{font-size:.85rem;font-weight:600;}
.comment-time{font-size:.75rem;color:var(--muted);}
.comment-text{font-size:.9rem;line-height:1.5;}
.comment-form{display:flex;gap:10px;margin-top:16px;align-items:flex-end;}
.comment-form textarea{flex:1;padding:10px 14px;background:var(--dark);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:.9rem;resize:none;min-height:44px;max-height:120px;outline:none;transition:.2s;}
.comment-form textarea:focus{border-color:var(--green);}
.no-comments{text-align:center;color:var(--muted);font-size:.9rem;padding:20px 0;}
.login-prompt{text-align:center;color:var(--muted);font-size:.85rem;padding:12px;background:rgba(255,255,255,.03);border-radius:8px;margin-top:12px;}

/* Form Styles */
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px;font-weight:500;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 14px;background:var(--dark);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:.95rem;outline:none;transition:.2s;}
.form-group input:focus,.form-group select,.form-group textarea:focus{border-color:var(--green);}
.form-group select{cursor:pointer;}
.form-group textarea{resize:vertical;min-height:80px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.photo-upload{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;cursor:pointer;transition:.2s;}
.photo-upload:hover{border-color:var(--green);}
.photo-preview{width:80px;height:80px;border-radius:50%;object-fit:cover;margin:0 auto 8px;display:block;}
.form-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;}
.toggle-group{display:flex;gap:10px;}
.toggle-option{flex:1;padding:8px;border:1px solid var(--border);border-radius:8px;text-align:center;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:.9rem;transition:.2s;background:transparent;color:var(--muted);}
.toggle-option.selected{background:var(--green);border-color:var(--green);color:#fff;}

/* FAB */
.fab{position:fixed;bottom:28px;left:28px;width:56px;height:56px;border-radius:50%;background:var(--green);border:none;color:#fff;font-size:1.6rem;cursor:pointer;box-shadow:0 4px 20px rgba(46,160,67,.4);transition:.2s;z-index:100;display:none;}
.fab:hover{transform:scale(1.1);box-shadow:0 6px 28px rgba(46,160,67,.5);}
.fab.show{display:flex;align-items:center;justify-content:center;}

/* Toast */
.toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:.9rem;min-width:240px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.5);animation:slideDown .3s ease;}
@keyframes slideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
.toast.success{border-color:var(--green);color:#3fb84e;}
.toast.error{border-color:#da3633;color:#f85149;}

/* Loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px;}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* Empty state */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state .icon{font-size:3rem;margin-bottom:12px;}

/* Scrollbar */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--dark);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--muted);}

@media(max-width:600px){
  header{flex-direction:column;gap:14px;text-align:center;}
  .header-title h1{font-size:1.4rem;}
  .info-grid{grid-template-columns:1fr;}
  .form-row{grid-template-columns:1fr;}
  .members-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));padding:14px;}
}
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="header-title">
    <h1>🌳 خێزانی مینە سەر فیل</h1>
    <p>شەجەرەی بنەماڵە — گۆخلان</p>
  </div>
  <div class="auth-area">
    <div class="user-info" id="userInfo" style="display:none;">
      <img class="user-avatar" id="userAvatar" src="" alt="">
      <span class="user-name" id="userName"></span>
      <button class="btn btn-logout" onclick="signOut()">دەرچوون</button>
    </div>
    <button class="btn btn-login" id="loginBtn" onclick="signInWithGoogle()">
      🔐 چوونەژوورەوە بە Google
    </button>
  </div>
</header>

<!-- Controls -->
<div class="controls">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="گەڕان بکە بە ناو..." oninput="filterMembers()">
  </div>
  <div class="gen-filters" id="genFilters">
    <button class="gen-btn active" data-gen="all" onclick="setGenFilter(this,'all')">هەموو</button>
  </div>
</div>

<!-- Stats -->
<div class="stats">
  <div class="stat-card"><span class="stat-icon">👥</span><div class="stat-info"><div class="stat-num" id="totalCount">0</div><div class="stat-label">کۆی ئەندامەکان</div></div></div>
  <div class="stat-card"><span class="stat-icon">✅</span><div class="stat-info"><div class="stat-num" id="aliveCount">0</div><div class="stat-label">زیندوو</div></div></div>
  <div class="stat-card"><span class="stat-icon">🏙️</span><div class="stat-info"><div class="stat-num" id="cityCount">0</div><div class="stat-label">شار</div></div></div>
  <div class="stat-card"><span class="stat-icon">🌿</span><div class="stat-info"><div class="stat-num" id="genCount">0</div><div class="stat-label">نەوە</div></div></div>
</div>

<!-- Members Grid -->
<div id="membersContainer">
  <div class="loading">
    <div class="spinner"></div>
    <p style="color:var(--muted)">داتا باردەکرێت...</p>
  </div>
</div>

<!-- FAB Add Member -->
<button class="fab" id="fabAdd" onclick="showAddModal()" title="زیادکردنی ئەندامی نوێ">+</button>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- ===== DETAIL MODAL ===== -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="detailModalTitle">زانیاری ئەندام</h2>
      <button class="modal-close" onclick="closeModal('detailModal')">✕</button>
    </div>
    <div class="modal-body" id="detailModalBody"></div>
  </div>
</div>

<!-- ===== EDIT MODAL ===== -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <h2>✏️ گۆڕانکاریکردنی ئەندام</h2>
      <button class="modal-close" onclick="closeModal('editModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editMemberId">
      <div class="form-group">
        <label>ناو</label>
        <input type="text" id="editName" placeholder="ناوی ئەندام">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>ساڵی لەدایکبوون</label>
          <input type="number" id="editBirth" placeholder="١٩٨٠">
        </div>
        <div class="form-group">
          <label>ساڵی مردن</label>
          <input type="number" id="editDeath" placeholder="٢٠٢٠">
        </div>
      </div>
      <div class="form-group">
        <label>باری ژیان</label>
        <div class="toggle-group">
          <button class="toggle-option selected" id="editAliveBtn" onclick="setAliveToggle(true)">✅ زیندوو</button>
          <button class="toggle-option" id="editDeadBtn" onclick="setAliveToggle(false)">💀 مردوو</button>
        </div>
      </div>
      <div class="form-group">
        <label>شار / نیشتەجێبوون</label>
        <input type="text" id="editCity" placeholder="سلێمانی">
      </div>
      <div class="form-group">
        <label>ژمارەی مۆبایل</label>
        <input type="text" id="editPhone" placeholder="07701234567">
      </div>
      <div class="form-group">
        <label>تێبینی</label>
        <textarea id="editNotes" placeholder="زانیاری زیاتر..."></textarea>
      </div>
      <div class="form-group">
        <label>وێنە</label>
        <div class="photo-upload" onclick="document.getElementById('editPhotoInput').click()">
          <img class="photo-preview" id="editPhotoPreview" src="" alt="" style="display:none;">
          <div id="editPhotoPlaceholder">📷 کلیک بکە بۆ هەڵبژاردنی وێنە</div>
        </div>
        <input type="file" id="editPhotoInput" accept="image/*" style="display:none;" onchange="previewPhoto('edit')">
      </div>
      <div class="form-actions">
        <button class="btn btn-secondary" onclick="closeModal('editModal')">هەڵوەشاندنەوە</button>
        <button class="btn btn-primary" onclick="saveMemberEdit()">💾 تۆمارکردن</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== ADD MODAL ===== -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <h2>➕ زیادکردنی ئەندامی نوێ</h2>
      <button class="modal-close" onclick="closeModal('addModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>ناو *</label>
        <input type="text" id="addName" placeholder="ناوی ئەندام">
      </div>
      <div class="form-group">
        <label>ڕەگەز</label>
        <div class="toggle-group">
          <button class="toggle-option selected" id="addMaleBtn" onclick="setGenderToggle('Male')">👨 کوڕ / پیاو</button>
          <button class="toggle-option" id="addFemaleBtn" onclick="setGenderToggle('Female')">👩 کچ / ژن</button>
        </div>
      </div>
      <input type="hidden" id="addGender" value="Male">
      <div class="form-group">
        <label>باوک</label>
        <select id="addFatherId">
          <option value="">— باوک هەڵبژێرە —</option>
        </select>
      </div>
      <div class="form-group">
        <label>دایک</label>
        <select id="addMotherId">
          <option value="">— دایک هەڵبژێرە —</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>ساڵی لەدایکبوون</label>
          <input type="number" id="addBirth" placeholder="١٩٩٠">
        </div>
        <div class="form-group">
          <label>شار</label>
          <input type="text" id="addCity" placeholder="سلێمانی">
        </div>
      </div>
      <div class="form-group">
        <label>تێبینی</label>
        <textarea id="addNotes" placeholder="زانیاری زیاتر..."></textarea>
      </div>
      <div class="form-group">
        <label>وێنە</label>
        <div class="photo-upload" onclick="document.getElementById('addPhotoInput').click()">
          <img class="photo-preview" id="addPhotoPreview" src="" alt="" style="display:none;">
          <div id="addPhotoPlaceholder">📷 کلیک بکە بۆ هەڵبژاردنی وێنە</div>
        </div>
        <input type="file" id="addPhotoInput" accept="image/*" style="display:none;" onchange="previewPhoto('add')">
      </div>
      <input type="hidden" id="addPhotoData" value="">
      <div class="form-actions">
        <button class="btn btn-secondary" onclick="closeModal('addModal')">هەڵوەشاندنەوە</button>
        <button class="btn btn-primary" onclick="saveNewMember()">✅ زیادکردن</button>
      </div>
    </div>
  </div>
</div>

<script>
// ==============================
// Firebase Config
// ==============================
const firebaseConfig = {
  apiKey: "AIzaSyA0XkvgwH4G6ylnTyNWLJDQBdgeqblaPbk",
  authDomain: "goxlanminasarfil.firebaseapp.com",
  databaseURL: "https://goxlanminasarfil-default-rtdb.firebaseio.com",
  projectId: "goxlanminasarfil",
  storageBucket: "goxlanminasarfil.appspot.com",
  messagingSenderId: "placeholder",
  appId: "placeholder"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// ==============================

// ==============================
// Firebase Data
// ==============================
function initData() {
  db.ref('family/members').once('value').then(snap => {
    if (!snap.exists()) {
      // Seed default members
      const obj = {};
      DEFAULT_MEMBERS.forEach(m => { obj[m.id] = m; });
      db.ref('family/members').set(obj).then(() => showToast('داتا تۆمارکرا ✓', 'success'));
    }
  });

  // Real-time listener
  db.ref('family/members').on('value', snap => {
    if (snap.exists()) {
      const data = snap.val();
      allMembers = Object.values(data).sort((a, b) => (a.id || 0) - (b.id || 0));
    } else {
      allMembers = [...DEFAULT_MEMBERS];
    }
    buildGenFilters();
    renderStats();
    filterMembers();
  });
}

// ==============================
// Generation Calc
// ==============================
const genCache = {};
function getGeneration(id, visited = new Set()) {
  if (id == null) return 0;
  if (genCache[id] !== undefined) return genCache[id];
  if (visited.has(id)) return 0;
  visited.add(id);
  const m = allMembers.find(x => x.id == id);
  if (!m) return 0;
  const fatherGen = m.fatherId ? getGeneration(m.fatherId, new Set(visited)) : -1;
  const motherGen = m.motherId ? getGeneration(m.motherId, new Set(visited)) : -1;
  const parentGen = Math.max(fatherGen, motherGen);
  const g = parentGen + 1;
  genCache[id] = g;
  return g;
}
function refreshGens() {
  Object.keys(genCache).forEach(k => delete genCache[k]);
  allMembers.forEach(m => getGeneration(m.id));
}

// ==============================
// Filters & Stats
// ==============================
function buildGenFilters() {
  refreshGens();
  const gens = [...new Set(allMembers.map(m => getGeneration(m.id)))].sort((a,b)=>a-b);
  const container = document.getElementById('genFilters');
  container.innerHTML = `<button class="gen-btn ${currentFilter==='all'?'active':''}" data-gen="all" onclick="setGenFilter(this,'all')">هەموو</button>`;
  gens.forEach(g => {
    const active = currentFilter == g ? 'active' : '';
    container.innerHTML += `<button class="gen-btn ${active}" data-gen="${g}" onclick="setGenFilter(this,${g})">نەوەی ${g+1}</button>`;
  });
}

function setGenFilter(btn, gen) {
  document.querySelectorAll('.gen-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = gen;
  filterMembers();
}

function renderStats() {
  refreshGens();
  document.getElementById('totalCount').textContent = allMembers.length;
  document.getElementById('aliveCount').textContent = allMembers.filter(m => m.isAlive).length;
  const cities = new Set(allMembers.map(m => m.city).filter(Boolean));
  document.getElementById('cityCount').textContent = cities.size;
  const gens = new Set(allMembers.map(m => getGeneration(m.id)));
  document.getElementById('genCount').textContent = gens.size;
}

function filterMembers() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let filtered = allMembers;
  if (currentFilter !== 'all') filtered = filtered.filter(m => getGeneration(m.id) == currentFilter);
  if (q) filtered = filtered.filter(m => (m.firstName||'').toLowerCase().includes(q) || (m.city||'').toLowerCase().includes(q) || (m.notes||'').toLowerCase().includes(q));
  renderGrid(filtered);
}

// ==============================
// Render Grid
// ==============================
function renderGrid(members) {
  const container = document.getElementById('membersContainer');
  if (!members.length) {
    container.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>هیچ ئەندامێک نەدۆزرایەوە</p></div>`;
    return;
  }
  container.innerHTML = `<div class="members-grid">${members.map(m => memberCard(m)).join('')}</div>`;
}

function memberCard(m) {
  const gen = getGeneration(m.id);
  const photoHtml = m.photo
    ? `<div class="member-photo"><img src="${m.photo}" alt="${m.firstName}" onerror="this.parentElement.innerHTML='${m.gender==='Female'?'👩':'👨'}'"></div>`
    : `<div class="member-photo">${m.gender==='Female'?'👩':'👨'}</div>`;
  const years = m.birthYear ? `${m.birthYear}${m.deathYear?' — '+m.deathYear:''}` : '';
  const badge = m.isAlive
    ? `<span class="alive-badge alive">زیندوو</span>`
    : `<span class="alive-badge deceased">مردوو</span>`;
  return `<div class="member-card" onclick="showDetail(${m.id})">
    <div class="card-top">
      ${photoHtml}
      <div class="member-info">
        <h3>${m.firstName||''}</h3>
        <div class="years">${years}</div>
        ${badge}
      </div>
    </div>
    <div class="card-meta">
      <span class="card-city">📍 ${m.city||'—'}</span>
      <span class="gen-badge">نەوەی ${gen+1}</span>
    </div>
  </div>`;
}

// ==============================
// Detail Modal
// ==============================
function showDetail(id) {
  const m = allMembers.find(x => x.id == id);
  if (!m) return;
  currentDetailId = id;

  const gen = getGeneration(m.id);
  const father = m.fatherId ? allMembers.find(x => x.id == m.fatherId) : null;
  const mother = m.motherId ? allMembers.find(x => x.id == m.motherId) : null;
  const children = allMembers.filter(x => x.fatherId == id || x.motherId == id);

  const photoHtml = m.photo
    ? `<div class="detail-photo"><img src="${m.photo}" alt="${m.firstName}" onerror="this.parentElement.innerHTML='${m.gender==='Female'?'👩':'👨'}'"></div>`
    : `<div class="detail-photo">${m.gender==='Female'?'👩':'👨'}</div>`;

  const editBtn = currentUser
    ? `<button class="btn btn-primary" onclick="showEditModal(${id})">✏️ گۆڕانکاری</button>`
    : '';

  const childrenHtml = children.length
    ? `<div class="children-list"><h4>🧒 منداڵەکان (${children.length})</h4>${children.map(c => `<span class="child-chip" onclick="closeModal('detailModal');setTimeout(()=>showDetail(${c.id}),100)">${c.firstName}</span>`).join('')}</div>`
    : '';

  document.getElementById('detailModalTitle').textContent = m.firstName;
  document.getElementById('detailModalBody').innerHTML = `
    ${photoHtml}
    <div class="detail-name">${m.firstName}</div>
    <div class="detail-years">${m.birthYear||'؟'} ${m.deathYear?'— '+m.deathYear:(m.isAlive?'— زیندوو':'')}</div>
    <div class="info-grid">
      <div class="info-item"><div class="info-label">ڕەگەز</div><div class="info-value">${m.gender==='Female'?'👩 کچ / ژن':'👨 کوڕ / پیاو'}</div></div>
      <div class="info-item"><div class="info-label">شار</div><div class="info-value">📍 ${m.city||'—'}</div></div>
      <div class="info-item"><div class="info-label">نەوە</div><div class="info-value">🌿 نەوەی ${gen+1}</div></div>
      <div class="info-item"><div class="info-label">مۆبایل</div><div class="info-value">${m.phone||'—'}</div></div>
      ${father?`<div class="info-item"><div class="info-label">باوک</div><div class="info-value"><a onclick="closeModal('detailModal');setTimeout(()=>showDetail(${father.id}),100)">${father.firstName}</a></div></div>`:''}
      ${mother?`<div class="info-item"><div class="info-label">دایک</div><div class="info-value"><a onclick="closeModal('detailModal');setTimeout(()=>showDetail(${mother.id}),100)">${mother.firstName}</a></div></div>`:''}
    </div>
    ${m.notes?`<div class="notes-box"><div class="info-label">📝 تێبینی</div><div style="margin-top:6px;line-height:1.6">${m.notes}</div></div>`:''}
    ${childrenHtml}
    <div class="detail-actions">${editBtn}</div>
    <div class="comments-section">
      <h4>💬 کۆمێنتەکان</h4>
      <div id="commentsList"><div class="no-comments">هیچ کۆمێنتێک نییە</div></div>
      ${currentUser
        ? `<div class="comment-form"><textarea id="commentText" placeholder="کۆمێنتت بنووسە..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitComment();}"></textarea><button class="btn btn-primary" onclick="submitComment()">ناردن</button></div>`
        : `<div class="login-prompt">🔐 چوونەژوورەوە بکە بۆ نووسینی کۆمێنت</div>`
      }
    </div>
  `;

  openModal('detailModal');
  loadComments(id);
}

// ==============================
// Comments
// ==============================
function loadComments(memberId) {
  if (commentsUnsubscribe) { commentsUnsubscribe(); commentsUnsubscribe = null; }
  const ref = db.ref(`family/comments/${memberId}`);
  const handler = snap => {
    const list = document.getElementById('commentsList');
    if (!list) return;
    if (!snap.exists()) {
      list.innerHTML = '<div class="no-comments">هیچ کۆمێنتێک نییە — یەکەمین بە!</div>';
      return;
    }
    const comments = Object.entries(snap.val()).map(([k,v])=>({key:k,...v})).sort((a,b)=>a.ts-b.ts);
    list.innerHTML = comments.map(c => {
      const time = new Date(c.ts).toLocaleDateString('ar-IQ');
      const avatar = c.photo
        ? `<div class="comment-avatar"><img src="${c.photo}" alt=""></div>`
        : `<div class="comment-avatar">${(c.name||'?')[0]}</div>`;
      return `<div class="comment-item">${avatar}<div class="comment-bubble"><div class="comment-meta"><span class="comment-name">${c.name||'ناناسراو'}</span><span class="comment-time">${time}</span></div><div class="comment-text">${c.text}</div></div></div>`;
    }).join('');
  };
  ref.on('value', handler);
  commentsUnsubscribe = () => ref.off('value', handler);
}

function submitComment() {
  if (!currentUser) { showToast('تکایە پێشتر چوونەژوورەوە بکە', 'error'); return; }
  const input = document.getElementById('commentText');
  const text = (input?.value || '').trim();
  if (!text) return;
  const ref = db.ref(`family/comments/${currentDetailId}`).push();
  ref.set({
    name: currentUser.displayName || currentUser.email,
    photo: currentUser.photoURL || '',
    text,
    ts: Date.now(),
    uid: currentUser.uid
  }).then(() => { input.value = ''; showToast('کۆمێنت نێردرا ✓', 'success'); })
    .catch(e => showToast('کێشە: ' + e.message, 'error'));
}

// ==============================
// Edit Member
// ==============================
function showEditModal(id) {
  const m = allMembers.find(x => x.id == id);
  if (!m || !currentUser) return;
  editPhotoData = m.photo || '';
  document.getElementById('editMemberId').value = id;
  document.getElementById('editName').value = m.firstName || '';
  document.getElementById('editBirth').value = m.birthYear || '';
  document.getElementById('editDeath').value = m.deathYear || '';
  document.getElementById('editCity').value = m.city || '';
  document.getElementById('editPhone').value = m.phone || '';
  document.getElementById('editNotes').value = m.notes || '';
  setAliveToggle(m.isAlive);
  const preview = document.getElementById('editPhotoPreview');
  const placeholder = document.getElementById('editPhotoPlaceholder');
  if (m.photo) { preview.src = m.photo; preview.style.display = 'block'; placeholder.style.display = 'none'; }
  else { preview.style.display = 'none'; placeholder.style.display = 'block'; }
  closeModal('detailModal');
  openModal('editModal');
}

function setAliveToggle(alive) {
  document.getElementById('editAliveBtn').classList.toggle('selected', alive);
  document.getElementById('editDeadBtn').classList.toggle('selected', !alive);
  document.getElementById('editAliveBtn').dataset.alive = alive ? '1' : '0';
}

function saveMemberEdit() {
  if (!currentUser) return;
  const id = document.getElementById('editMemberId').value;
  const alive = document.getElementById('editAliveBtn').classList.contains('selected');
  const updates = {
    firstName: document.getElementById('editName').value.trim(),
    birthYear: document.getElementById('editBirth').value || '',
    deathYear: document.getElementById('editDeath').value || '',
    isAlive: alive,
    city: document.getElementById('editCity').value.trim(),
    phone: document.getElementById('editPhone').value.trim(),
    notes: document.getElementById('editNotes').value.trim(),
    photo: editPhotoData,
    lastEditedBy: currentUser.displayName || currentUser.email,
    lastEditedAt: Date.now()
  };
  if (!updates.firstName) { showToast('ناو داخڵ بکە!', 'error'); return; }
  db.ref(`family/members/${id}`).update(updates)
    .then(() => { showToast('تۆمارکرا ✓', 'success'); closeModal('editModal'); })
    .catch(e => showToast('کێشە: ' + e.message, 'error'));
}

// ==============================
// Add Member
// ==============================
function showAddModal() {
  if (!currentUser) { showToast('تکایە پێشتر چوونەژوورەوە بکە', 'error'); return; }
  document.getElementById('addName').value = '';
  document.getElementById('addBirth').value = '';
  document.getElementById('addCity').value = '';
  document.getElementById('addNotes').value = '';
  document.getElementById('addGender').value = 'Male';
  document.getElementById('addMaleBtn').classList.add('selected');
  document.getElementById('addFemaleBtn').classList.remove('selected');
  addPhotoDataVal = '';
  document.getElementById('addPhotoPreview').style.display = 'none';
  document.getElementById('addPhotoPlaceholder').style.display = 'block';

  // Populate parent dropdowns
  const males = allMembers.filter(m => m.gender === 'Male').sort((a,b) => (a.firstName||'').localeCompare(b.firstName||''));
  const females = allMembers.filter(m => m.gender === 'Female').sort((a,b) => (a.firstName||'').localeCompare(b.firstName||''));
  document.getElementById('addFatherId').innerHTML = '<option value="">— باوک هەڵبژێرە —</option>' + males.map(m => `<option value="${m.id}">${m.firstName}</option>`).join('');
  document.getElementById('addMotherId').innerHTML = '<option value="">— دایک هەڵبژێرە —</option>' + females.map(m => `<option value="${m.id}">${m.firstName}</option>`).join('');

  openModal('addModal');
}

function setGenderToggle(g) {
  document.getElementById('addGender').value = g;
  document.getElementById('addMaleBtn').classList.toggle('selected', g === 'Male');
  document.getElementById('addFemaleBtn').classList.toggle('selected', g === 'Female');
}

function saveNewMember() {
  if (!currentUser) return;
  const name = document.getElementById('addName').value.trim();
  if (!name) { showToast('ناو پێویستە!', 'error'); return; }
  const maxId = Math.max(...allMembers.map(m => m.id || 0), 0);
  const newId = maxId + 1;
  const fatherId = document.getElementById('addFatherId').value ? parseInt(document.getElementById('addFatherId').value) : null;
  const motherId = document.getElementById('addMotherId').value ? parseInt(document.getElementById('addMotherId').value) : null;
  const member = {
    id: newId,
    firstName: name,
    gender: document.getElementById('addGender').value,
    fatherId,
    motherId,
    birthYear: document.getElementById('addBirth').value || '',
    deathYear: '',
    isAlive: true,
    city: document.getElementById('addCity').value.trim(),
    phone: '',
    notes: document.getElementById('addNotes').value.trim(),
    photo: addPhotoDataVal,
    addedBy: currentUser.displayName || currentUser.email,
    addedAt: Date.now()
  };
  db.ref(`family/members/${newId}`).set(member)
    .then(() => { showToast(`${name} زیادکرا ✓`, 'success'); closeModal('addModal'); })
    .catch(e => showToast('کێشە: ' + e.message, 'error'));
}

// ==============================
// Photo Upload
// ==============================
function previewPhoto(mode) {
  const input = document.getElementById(mode + 'PhotoInput');
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const data = e.target.result;
    if (mode === 'edit') {
      editPhotoData = data;
      document.getElementById('editPhotoPreview').src = data;
      document.getElementById('editPhotoPreview').style.display = 'block';
      document.getElementById('editPhotoPlaceholder').style.display = 'none';
    } else {
      addPhotoDataVal = data;
      document.getElementById('addPhotoPreview').src = data;
      document.getElementById('addPhotoPreview').style.display = 'block';
      document.getElementById('addPhotoPlaceholder').style.display = 'none';
    }
  };
  reader.readAsDataURL(file);
}

// ==============================
function openModal(id) {
  document.getElementById(id).classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
  document.body.style.overflow = '';
  if (id === 'detailModal' && commentsUnsubscribe) { commentsUnsubscribe(); commentsUnsubscribe = null; }
}
document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) closeModal(o.id); });
});

// ==============================
// Toast
// ==============================
function showToast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.getElementById('toastContainer').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// Init
// ==============================
initData();
