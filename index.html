<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نەوەکانی مینە سەر فیل</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:#0f1923;color:#e8edf2;direction:rtl;min-height:100vh}
:root{--green:#22c55e;--green-dark:#15803d;--gold:#f59e0b;--card:#1a2535;--border:#2a3a4a;--muted:#64748b;--danger:#ef4444}

/* ===== HEADER ===== */
.site-header{background:linear-gradient(160deg,#0a1f0a,#0d2e1a,#0f3d20);padding:28px 24px 24px;text-align:center;border-bottom:1px solid rgba(34,197,94,.2);box-shadow:0 4px 30px rgba(0,0,0,.5)}
.site-header h1{font-size:2rem;font-weight:900;color:#fff;letter-spacing:.5px}
.site-header h1 span{color:var(--gold)}
.site-header p{color:#86efac;margin-top:6px;font-size:.95rem}
.header-stats{display:flex;justify-content:center;gap:24px;margin-top:18px;flex-wrap:wrap}
.hstat{text-align:center;background:rgba(255,255,255,.06);padding:10px 20px;border-radius:12px;border:1px solid rgba(255,255,255,.08)}
.hstat-num{font-size:1.4rem;font-weight:800;color:var(--green)}
.hstat-lbl{font-size:.72rem;color:#86efac;margin-top:2px}

/* ===== TOOLBAR ===== */
.toolbar{background:#111e2b;padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;backdrop-filter:blur(10px)}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-wrap input{width:100%;padding:10px 14px 10px 42px;background:#0f1923;border:1px solid var(--border);border-radius:10px;color:#e8edf2;font-family:'Tajawal',sans-serif;font-size:.9rem;outline:none;transition:.2s}
.search-wrap input:focus{border-color:var(--green)}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:1rem;color:var(--muted)}
.filter-btns{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'Tajawal',sans-serif;font-size:.82rem;transition:.2s;white-space:nowrap}
.fbtn:hover,.fbtn.on{background:var(--green);border-color:var(--green);color:#fff}
.add-btn{padding:9px 18px;background:var(--green);border:none;border-radius:10px;color:#fff;font-family:'Tajawal',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:.2s}
.add-btn:hover{background:#16a34a}

/* ===== GRID ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:.25s;position:relative}
.card:hover{border-color:var(--green);transform:translateY(-4px);box-shadow:0 12px 40px rgba(34,197,94,.15)}
.card-stripe{height:3px;background:linear-gradient(90deg,var(--green),var(--gold))}
.card-body{padding:18px}
.card-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.avatar{width:58px;height:58px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0;overflow:hidden;border:2px solid var(--border)}
.avatar img{width:100%;height:100%;object-fit:cover}
.card-info h3{font-size:.95rem;font-weight:700;line-height:1.3;color:#e8edf2}
.card-info .years{font-size:.78rem;color:var(--muted);margin-top:3px}
.badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:.7rem;font-weight:600;margin-top:4px}
.alive{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.25)}
.dead{background:rgba(100,116,139,.1);color:var(--muted);border:1px solid var(--border)}
.card-footer{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--border);margin-top:2px}
.city{font-size:.78rem;color:var(--muted)}
.gen-tag{font-size:.7rem;padding:3px 9px;border-radius:10px;background:rgba(245,158,11,.1);color:var(--gold);border:1px solid rgba(245,158,11,.2)}
.no-photo-edit{position:absolute;top:10px;left:10px;width:26px;height:26px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;opacity:0;transition:.2s}
.card:hover .no-photo-edit{opacity:1}

/* ===== MODAL ===== */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(6px)}
.overlay.open{display:flex}
.modal{background:#1a2535;border:1px solid var(--border);border-radius:18px;width:100%;max-width:580px;max-height:94vh;overflow-y:auto;position:relative;animation:popIn .25s cubic-bezier(.175,.885,.32,1.275)}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.mhead{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#1a2535;z-index:5}
.mhead h2{font-size:1.1rem;font-weight:700}
.mclose{background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:4px 8px;border-radius:6px;transition:.15s}
.mclose:hover{background:var(--border);color:#e8edf2}
.mbody{padding:22px}

/* Detail view */
.det-photo{width:100px;height:100px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;background:var(--border);border:3px solid var(--green);overflow:hidden}
.det-photo img{width:100%;height:100%;object-fit:cover}
.det-name{text-align:center;font-size:1.4rem;font-weight:800;margin-bottom:4px}
.det-sub{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:18px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.ibox{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:11px 13px}
.ibox-lbl{font-size:.72rem;color:var(--muted);margin-bottom:3px}
.ibox-val{font-size:.9rem;font-weight:500}
.ibox-val a{color:var(--green);cursor:pointer;text-decoration:none}
.ibox-val a:hover{text-decoration:underline}
.notes-card{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:13px;margin-bottom:14px;line-height:1.7;font-size:.9rem}
.children-wrap{margin-bottom:16px}
.children-wrap h4{font-size:.82rem;color:var(--muted);margin-bottom:8px}
.child-pill{display:inline-block;padding:4px 12px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);border-radius:20px;font-size:.82rem;color:var(--green);margin:3px;cursor:pointer}
.child-pill:hover{background:rgba(34,197,94,.2)}
.det-actions{display:flex;gap:10px;margin-bottom:0}

/* Form */
.fgroup{margin-bottom:15px}
.fgroup label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px;font-weight:500}
.fgroup input,.fgroup select,.fgroup textarea{width:100%;padding:10px 13px;background:#0f1923;border:1px solid var(--border);border-radius:9px;color:#e8edf2;font-family:'Tajawal',sans-serif;font-size:.9rem;outline:none;transition:.2s}
.fgroup input:focus,.fgroup textarea:focus{border-color:var(--green)}
.fgroup select{cursor:pointer}
.fgroup textarea{resize:vertical;min-height:80px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-drop{border:2px dashed var(--border);border-radius:12px;padding:22px;text-align:center;cursor:pointer;transition:.2s;background:#0f1923}
.photo-drop:hover{border-color:var(--green);background:rgba(34,197,94,.04)}
.photo-drop-preview{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--green);margin:0 auto 8px;display:block}
.photo-hint{color:var(--muted);font-size:.82rem;margin-top:4px}
.toggle-row{display:flex;gap:8px}
.tog{flex:1;padding:9px;border:1px solid var(--border);border-radius:8px;text-align:center;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:.85rem;background:#0f1923;color:var(--muted);transition:.2s}
.tog.on{background:var(--green);border-color:var(--green);color:#fff}
.form-footer{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
.btn{padding:10px 20px;border:none;border-radius:9px;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:.9rem;font-weight:700;transition:.2s}
.btn-g{background:var(--green);color:#fff}.btn-g:hover{background:#16a34a}
.btn-s{background:var(--border);color:#e8edf2}.btn-s:hover{background:#3a4a5a}
.btn-d{background:var(--danger);color:#fff}.btn-d:hover{background:#dc2626}
.btn:disabled{opacity:.6;cursor:not-allowed}

/* Toast */
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#1a2535;border:1px solid var(--border);padding:11px 22px;border-radius:10px;font-size:.88rem;z-index:9999;display:none;animation:toastIn .25s ease;box-shadow:0 8px 30px rgba(0,0,0,.5)}
@keyframes toastIn{from{opacity:0;top:4px}to{opacity:1;top:18px}}
#toast.ok{border-color:var(--green);color:var(--green)}
#toast.err{border-color:var(--danger);color:var(--danger)}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .ei{font-size:3rem;margin-bottom:12px}

/* Loading */
.loading{text-align:center;padding:70px 20px}
.spin{width:42px;height:42px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Sync badge */
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:middle}
.sync-ok{background:var(--green)}.sync-off{background:var(--muted)}

@media(max-width:560px){
  .info-grid{grid-template-columns:1fr}
  .frow{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));padding:12px;gap:10px}
  .site-header h1{font-size:1.5rem}
  .toolbar{padding:10px 12px}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="site-header">
  <h1>🌳 نەوەکانی <span>مینە سەر فیل</span></h1>
  <p>شەجەرەی بنەماڵەی گۆخلان <span id="syncStatus" title="Firebase">• <span class="sync-dot sync-off" id="syncDot"></span></span></p>
  <div class="header-stats">
    <div class="hstat"><div class="hstat-num" id="sTotal">٠</div><div class="hstat-lbl">کۆی ئەندام</div></div>
    <div class="hstat"><div class="hstat-num" id="sAlive">٠</div><div class="hstat-lbl">زیندوو</div></div>
    <div class="hstat"><div class="hstat-num" id="sCities">٠</div><div class="hstat-lbl">شار</div></div>
    <div class="hstat"><div class="hstat-num" id="sGens">٠</div><div class="hstat-lbl">نەوە</div></div>
  </div>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchQ" placeholder="گەڕان بکە بە ناو، شار..." oninput="doFilter()">
  </div>
  <div class="filter-btns" id="filterBtns">
    <button class="fbtn on" data-g="all" onclick="setGen(this,'all')">هەموو</button>
  </div>
  <button class="add-btn" onclick="openAdd()">➕ ئەندامی نوێ</button>
</div>

<!-- GRID -->
<div id="grid"><div class="loading"><div class="spin"></div><p style="color:var(--muted)">بارکردن...</p></div></div>

<!-- Toast -->
<div id="toast"></div>

<!-- ===== DETAIL MODAL ===== -->
<div class="overlay" id="detModal">
  <div class="modal">
    <div class="mhead">
      <h2 id="detTitle">زانیاری ئەندام</h2>
      <button class="mclose" onclick="closeModal('detModal')">✕</button>
    </div>
    <div class="mbody" id="detBody"></div>
  </div>
</div>

<!-- ===== EDIT MODAL ===== -->
<div class="overlay" id="editModal">
  <div class="modal">
    <div class="mhead">
      <h2 id="editTitle">✏️ گۆڕانکاری</h2>
      <button class="mclose" onclick="closeModal('editModal')">✕</button>
    </div>
    <div class="mbody">
      <input type="hidden" id="eId">
      <div class="fgroup"><label>ناوی تەواو *</label><input type="text" id="eName" placeholder="ناو..."></div>
      <div class="frow">
        <div class="fgroup"><label>ساڵی لەدایکبوون</label><input type="number" id="eBirth" placeholder="١٩٨٠"></div>
        <div class="fgroup"><label>ساڵی مردن</label><input type="number" id="eDeath" placeholder="(ئەگەر مردوو بوو)"></div>
      </div>
      <div class="fgroup"><label>باری ژیان</label>
        <div class="toggle-row">
          <button class="tog on" id="eAliveBtn" onclick="setAlive(true)">✅ زیندوو</button>
          <button class="tog" id="eDeadBtn" onclick="setAlive(false)">💀 مردوو</button>
        </div>
      </div>
      <div class="frow">
        <div class="fgroup"><label>شار</label><input type="text" id="eCity" placeholder="سلێمانی..."></div>
        <div class="fgroup"><label>مۆبایل</label><input type="text" id="ePhone" placeholder="07701234567"></div>
      </div>
      <div class="fgroup"><label>کار / پیشە</label><input type="text" id="eJob" placeholder="مامۆستا، دکتۆر..."></div>
      <div class="fgroup"><label>تێبینی</label><textarea id="eNotes" placeholder="هەر زانیارێک..."></textarea></div>
      <div class="fgroup"><label>وێنە</label>
        <div class="photo-drop" onclick="document.getElementById('ePhotoFile').click()">
          <img id="ePhotoPreview" class="photo-drop-preview" src="" style="display:none">
          <div id="ePhotoIcon">📷</div>
          <div class="photo-hint" id="ePhotoHint">کلیک بکە بۆ هەڵبژاردنی وێنە</div>
        </div>
        <input type="file" id="ePhotoFile" accept="image/*" style="display:none" onchange="loadPhoto('e')">
      </div>
      <div class="form-footer">
        <button class="btn btn-s" onclick="closeModal('editModal')">هەڵوەشاندنەوە</button>
        <button class="btn btn-g" id="eSaveBtn" onclick="saveEdit()">💾 تۆمارکردن</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== ADD MODAL ===== -->
<div class="overlay" id="addModal">
  <div class="modal">
    <div class="mhead">
      <h2>➕ زیادکردنی ئەندامی نوێ</h2>
      <button class="mclose" onclick="closeModal('addModal')">✕</button>
    </div>
    <div class="mbody">
      <div class="fgroup"><label>ناوی تەواو *</label><input type="text" id="aName" placeholder="ناوی ئەندام..."></div>
      <div class="fgroup"><label>ڕەگەز</label>
        <div class="toggle-row">
          <button class="tog on" id="aMaleBtn" onclick="setGender('Male')">👨 کوڕ / پیاو</button>
          <button class="tog" id="aFemaleBtn" onclick="setGender('Female')">👩 کچ / ژن</button>
        </div>
      </div>
      <input type="hidden" id="aGender" value="Male">
      <div class="frow">
        <div class="fgroup"><label>باوک</label>
          <select id="aFather"><option value="">— هەڵبژێرە —</option></select>
        </div>
        <div class="fgroup"><label>دایک</label>
          <select id="aMother"><option value="">— هەڵبژێرە —</option></select>
        </div>
      </div>
      <div class="frow">
        <div class="fgroup"><label>ساڵی لەدایکبوون</label><input type="number" id="aBirth" placeholder="١٩٩٠"></div>
        <div class="fgroup"><label>شار</label><input type="text" id="aCity" placeholder="سلێمانی..."></div>
      </div>
      <div class="fgroup"><label>مۆبایل</label><input type="text" id="aPhone" placeholder="07701234567"></div>
      <div class="fgroup"><label>کار / پیشە</label><input type="text" id="aJob" placeholder="مامۆستا، دکتۆر..."></div>
      <div class="fgroup"><label>تێبینی</label><textarea id="aNotes" placeholder="زانیاری زیاتر..."></textarea></div>
      <div class="fgroup"><label>وێنە</label>
        <div class="photo-drop" onclick="document.getElementById('aPhotoFile').click()">
          <img id="aPhotoPreview" class="photo-drop-preview" src="" style="display:none">
          <div id="aPhotoIcon">📷</div>
          <div class="photo-hint">کلیک بکە بۆ هەڵبژاردنی وێنە <small>(ئارەزوومەندانە)</small></div>
        </div>
        <input type="file" id="aPhotoFile" accept="image/*" style="display:none" onchange="loadPhoto('a')">
      </div>
      <div class="form-footer">
        <button class="btn btn-s" onclick="closeModal('addModal')">هەڵوەشاندنەوە</button>
        <button class="btn btn-g" onclick="saveAdd()">✅ زیادکردن</button>
      </div>
    </div>
  </div>
</div>

// ─── State ──────────────────────────────────────────────────
let members=[], activeGen='all', ePhotoData='', aPhotoData='';
const LS_KEY='mina_family_v5';

// ─── Local Storage ──────────────────────────────────────────
function saveLocal(arr){ try{localStorage.setItem(LS_KEY,JSON.stringify(arr));}catch(e){} }
function loadLocal(){ try{const d=localStorage.getItem(LS_KEY);return d?JSON.parse(d):null;}catch(e){return null;} }

// ─── Generation ─────────────────────────────────────────────
const _gc={};
function gen(id,vis=new Set()){
  if(id==null)return 0; if(_gc[id]!==undefined)return _gc[id];
  if(vis.has(id))return 0; vis.add(id);
  const m=members.find(x=>x.id==id); if(!m)return 0;
  const fg=m.fatherId?gen(m.fatherId,new Set(vis)):-1;
  const mg=m.motherId?gen(m.motherId,new Set(vis)):-1;
  return (_gc[id]=Math.max(fg,mg)+1);
}
function clearGC(){Object.keys(_gc).forEach(k=>delete _gc[k]);}

// ─── Init ────────────────────────────────────────────────────
function init(){
  // Try local first
  const local=loadLocal();
  if(local&&local.length){ members=local; render(); }
  else { members=[...SEED]; render(); }

  // Then try Firebase
  if(!db){setSyncDot(false);return;}
  db.ref('family/members').once('value')
    .then(snap=>{
      if(snap.exists()){
        const fb=Object.values(snap.val()).sort((a,b)=>a.id-b.id);
        if(fb.length>=members.length){ members=fb; saveLocal(members); render(); }
        else{
          // Firebase empty or less data — upload seed
          if(fb.length<3){ uploadSeed(); }
        }
      } else { uploadSeed(); }
      setupRealtimeListener();
    })
    .catch(()=>{ setSyncDot(false); });
}

function uploadSeed(){
  if(!db)return;
  const obj={};
  SEED.forEach(m=>{obj[m.id]=m;});
  db.ref('family/members').set(obj)
    .then(()=>{toast('داتا تۆمارکرا ✓','ok'); setSyncDot(true);})
    .catch(()=>setSyncDot(false));
}

function setupRealtimeListener(){
  if(!db)return;
  db.ref('family/members').on('value',snap=>{
    setSyncDot(true);
    if(!snap.exists())return;
    const fb=Object.values(snap.val()).sort((a,b)=>a.id-b.id);
    members=fb; saveLocal(members); clearGC(); render();
  },()=>setSyncDot(false));
}

function setSyncDot(ok){
  fbOk=ok;
  document.getElementById('syncDot').className='sync-dot '+(ok?'sync-ok':'sync-off');
}

// ─── Render ──────────────────────────────────────────────────
function render(){
  clearGC();
  buildFilters();
  updateStats();
  doFilter();
}

function buildFilters(){
  const gens=[...new Set(members.map(m=>gen(m.id)))].sort((a,b)=>a-b);
  const c=document.getElementById('filterBtns');
  c.innerHTML=`<button class="fbtn ${activeGen==='all'?'on':''}" data-g="all" onclick="setGen(this,'all')">هەموو</button>`;
  gens.forEach(g=>{
    c.innerHTML+=`<button class="fbtn ${activeGen==g?'on':''}" data-g="${g}" onclick="setGen(this,${g})">نەوەی ${g+1}</button>`;
  });
}

function setGen(btn,g){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); activeGen=g; doFilter(); }

function updateStats(){
  clearGC();
  document.getElementById('sTotal').textContent=members.length;
  document.getElementById('sAlive').textContent=members.filter(m=>m.isAlive).length;
  document.getElementById('sCities').textContent=new Set(members.map(m=>m.city).filter(Boolean)).size;
  document.getElementById('sGens').textContent=new Set(members.map(m=>gen(m.id))).size;
}

function doFilter(){
  const q=(document.getElementById('searchQ').value||'').toLowerCase().trim();
  let list=members;
  if(activeGen!=='all') list=list.filter(m=>gen(m.id)==activeGen);
  if(q) list=list.filter(m=>(m.firstName||'').toLowerCase().includes(q)||(m.city||'').toLowerCase().includes(q)||(m.notes||'').toLowerCase().includes(q)||(m.job||'').toLowerCase().includes(q));
  renderGrid(list);
}

function renderGrid(list){
  const c=document.getElementById('grid');
  if(!list.length){ c.innerHTML='<div class="empty"><div class="ei">🔍</div><p>هیچ ئەندامێک نەدۆزرایەوە</p></div>'; return; }
  c.innerHTML=`<div class="grid">${list.map(cardHtml).join('')}</div>`;
}

function emo(m){ return m.gender==='Female'?'👩':'👨'; }

function cardHtml(m){
  const g=gen(m.id);
  const yrs=m.birthYear?`${m.birthYear}${m.deathYear?' — '+m.deathYear:''}`:'' ;
  const av=m.photo?`<div class="avatar"><img src="${m.photo}" onerror="this.parentElement.innerHTML='${emo(m)}'"></div>`:`<div class="avatar">${emo(m)}</div>`;
  const bdg=m.isAlive?`<span class="badge alive">زیندوو</span>`:`<span class="badge dead">مردوو</span>`;
  return `<div class="card" onclick="openDet(${m.id})">
    <div class="card-stripe"></div>
    <div class="card-body">
      <div class="card-top">${av}<div class="card-info"><h3>${m.firstName||''}</h3><div class="years">${yrs}</div>${bdg}</div></div>
      <div class="card-footer"><span class="city">📍 ${m.city||'—'}</span><span class="gen-tag">نەوەی ${g+1}</span></div>
    </div>
    <div class="no-photo-edit" title="گۆڕانکاری">✏️</div>
  </div>`;
}

// ─── Detail Modal ────────────────────────────────────────────
function openDet(id){
  const m=members.find(x=>x.id==id); if(!m)return;
  const g=gen(m.id);
  const father=m.fatherId?members.find(x=>x.id==m.fatherId):null;
  const mother=m.motherId?members.find(x=>x.id==m.motherId):null;
  const kids=members.filter(x=>x.fatherId==id||x.motherId==id);
  const yrs=`${m.birthYear||'؟'} ${m.deathYear?'— '+m.deathYear:(m.isAlive?'— زیندوو':'')}`;
  const av=m.photo?`<div class="det-photo"><img src="${m.photo}" onerror="this.innerHTML='${emo(m)}'"></div>`:`<div class="det-photo">${emo(m)}</div>`;
  const kidsHtml=kids.length?`<div class="children-wrap"><h4>🧒 منداڵەکان (${kids.length})</h4>${kids.map(k=>`<span class="child-pill" onclick="closeThenOpen(${k.id})">${k.firstName}</span>`).join('')}</div>`:'';
  const jobHtml=m.job?`<div class="ibox"><div class="ibox-lbl">💼 کار</div><div class="ibox-val">${m.job}</div></div>`:'';
  document.getElementById('detTitle').textContent=m.firstName;
  document.getElementById('detBody').innerHTML=`
    ${av}
    <div class="det-name">${m.firstName}</div>
    <div class="det-sub">${yrs}</div>
    <div class="info-grid">
      <div class="ibox"><div class="ibox-lbl">ڕەگەز</div><div class="ibox-val">${m.gender==='Female'?'👩 کچ/ژن':'👨 کوڕ/پیاو'}</div></div>
      <div class="ibox"><div class="ibox-lbl">📍 شار</div><div class="ibox-val">${m.city||'—'}</div></div>
      <div class="ibox"><div class="ibox-lbl">🌿 نەوە</div><div class="ibox-val">نەوەی ${g+1}</div></div>
      <div class="ibox"><div class="ibox-lbl">📞 مۆبایل</div><div class="ibox-val">${m.phone||'—'}</div></div>
      ${father?`<div class="ibox"><div class="ibox-lbl">باوک</div><div class="ibox-val"><a onclick="closeThenOpen(${father.id})">${father.firstName}</a></div></div>`:''}
      ${mother?`<div class="ibox"><div class="ibox-lbl">دایک</div><div class="ibox-val"><a onclick="closeThenOpen(${mother.id})">${mother.firstName}</a></div></div>`:''}
      ${jobHtml}
    </div>
    ${m.notes?`<div class="notes-card">📝 ${m.notes}</div>`:''}
    ${kidsHtml}
    <div class="det-actions">
      <button class="btn btn-g" style="width:100%" onclick="openEdit(${id})">✏️ گۆڕانکاری / زیادکردنی زانیاری</button>
    </div>`;
  openModal('detModal');
}

function closeThenOpen(id){ closeModal('detModal'); setTimeout(()=>openDet(id),150); }

// ─── Edit Modal ──────────────────────────────────────────────
function openEdit(id){
  const m=members.find(x=>x.id==id); if(!m)return;
  ePhotoData=m.photo||'';
  document.getElementById('eId').value=id;
  document.getElementById('eName').value=m.firstName||'';
  document.getElementById('eBirth').value=m.birthYear||'';
  document.getElementById('eDeath').value=m.deathYear||'';
  document.getElementById('eCity').value=m.city||'';
  document.getElementById('ePhone').value=m.phone||'';
  document.getElementById('eJob').value=m.job||'';
  document.getElementById('eNotes').value=m.notes||'';
  setAlive(m.isAlive);
  const prev=document.getElementById('ePhotoPreview');
  const ico=document.getElementById('ePhotoIcon');
  const hint=document.getElementById('ePhotoHint');
  if(m.photo){prev.src=m.photo;prev.style.display='block';ico.style.display='none';hint.textContent='✅ وێنە هەیە — کلیک بکە بۆ گۆڕینی';}
  else{prev.style.display='none';ico.style.display='block';hint.textContent='کلیک بکە بۆ هەڵبژاردنی وێنە';}
  document.getElementById('editTitle').textContent='✏️ '+m.firstName;
  closeModal('detModal');
  openModal('editModal');
}

function setAlive(v){
  document.getElementById('eAliveBtn').classList.toggle('on',v);
  document.getElementById('eDeadBtn').classList.toggle('on',!v);
}

async function saveEdit(){
  const id=document.getElementById('eId').value;
  const name=document.getElementById('eName').value.trim();
  if(!name){toast('ناو داخڵ بکە!','err');return;}
  const alive=document.getElementById('eAliveBtn').classList.contains('on');
  const updates={
    firstName:name,
    birthYear:document.getElementById('eBirth').value||null,
    deathYear:document.getElementById('eDeath').value||null,
    isAlive:alive, city:document.getElementById('eCity').value.trim(),
    phone:document.getElementById('ePhone').value.trim(),
    job:document.getElementById('eJob').value.trim(),
    notes:document.getElementById('eNotes').value.trim(),
    photo:ePhotoData, updatedAt:Date.now()
  };
  // Update local
  const idx=members.findIndex(m=>m.id==id);
  if(idx>-1){ members[idx]={...members[idx],...updates}; saveLocal(members); clearGC(); render(); }
  closeModal('editModal');
  toast('تۆمارکرا ✓','ok');
  // Firebase
  if(db){ db.ref(`family/members/${id}`).update(updates).catch(e=>toast('کێشەی ئینتەرنێت: '+e.code,'err')); }
}

// ─── Add Modal ───────────────────────────────────────────────
function openAdd(){
  aPhotoData='';
  ['aName','aBirth','aCity','aPhone','aJob','aNotes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('aGender').value='Male';
  document.getElementById('aMaleBtn').classList.add('on');
  document.getElementById('aFemaleBtn').classList.remove('on');
  document.getElementById('aPhotoPreview').style.display='none';
  document.getElementById('aPhotoIcon').style.display='block';
  const males=members.filter(m=>m.gender==='Male').sort((a,b)=>(a.firstName||'').localeCompare(b.firstName||''));
  const females=members.filter(m=>m.gender==='Female').sort((a,b)=>(a.firstName||'').localeCompare(b.firstName||''));
  document.getElementById('aFather').innerHTML='<option value="">— باوک هەڵبژێرە —</option>'+males.map(m=>`<option value="${m.id}">${m.firstName}</option>`).join('');
  document.getElementById('aMother').innerHTML='<option value="">— دایک هەڵبژێرە —</option>'+females.map(m=>`<option value="${m.id}">${m.firstName}</option>`).join('');
  openModal('addModal');
}

function setGender(g){
  document.getElementById('aGender').value=g;
  document.getElementById('aMaleBtn').classList.toggle('on',g==='Male');
  document.getElementById('aFemaleBtn').classList.toggle('on',g==='Female');
}

async function saveAdd(){
  const name=document.getElementById('aName').value.trim();
  if(!name){toast('ناو پێویستە!','err');return;}
  const maxId=Math.max(...members.map(m=>m.id||0),0);
  const newId=maxId+1;
  const fid=document.getElementById('aFather').value;
  const mid=document.getElementById('aMother').value;
  const m={
    id:newId, firstName:name,
    gender:document.getElementById('aGender').value,
    fatherId:fid?parseInt(fid):null, motherId:mid?parseInt(mid):null,
    birthYear:document.getElementById('aBirth').value||null,
    deathYear:null, isAlive:true,
    city:document.getElementById('aCity').value.trim(),
    phone:document.getElementById('aPhone').value.trim(),
    job:document.getElementById('aJob').value.trim(),
    notes:document.getElementById('aNotes').value.trim(),
    photo:aPhotoData, addedAt:Date.now()
  };
  members.push(m); saveLocal(members); clearGC(); render();
  closeModal('addModal');
  toast(`${name} زیادکرا ✓`,'ok');
  if(db){ db.ref(`family/members/${newId}`).set(m).catch(e=>toast('کێشەی ئینتەرنێت','err')); }
}

// ─── Photo Upload ────────────────────────────────────────────
function loadPhoto(prefix){
  const file=document.getElementById(prefix+'PhotoFile').files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const max=500; let w=img.width,h=img.height;
      if(w>h){if(w>max){h*=max/w;w=max;}}else{if(h>max){w*=max/h;h=max;}}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const data=canvas.toDataURL('image/jpeg',0.8);
      if(prefix==='e'){
        ePhotoData=data;
        document.getElementById('ePhotoPreview').src=data;
        document.getElementById('ePhotoPreview').style.display='block';
        document.getElementById('ePhotoIcon').style.display='none';
        document.getElementById('ePhotoHint').textContent='✅ وێنە هەڵبژێردرا';
      } else {
        aPhotoData=data;
        document.getElementById('aPhotoPreview').src=data;
        document.getElementById('aPhotoPreview').style.display='block';
        document.getElementById('aPhotoIcon').style.display='none';
      }
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

// ─── Modal Helpers ────────────────────────────────────────────
function openModal(id){ document.getElementById(id).classList.add('open'); document.body.style.overflow='hidden'; }
function closeModal(id){ document.getElementById(id).classList.remove('open'); document.body.style.overflow=''; }
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeModal(o.id);}));

// ─── Toast ────────────────────────────────────────────────────
let _tt;
function toast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=type; t.style.display='block';
  clearTimeout(_tt); _tt=setTimeout(()=>t.style.display='none',3000);
}

// ─── Start ────────────────────────────────────────────────────
init();
</script>
